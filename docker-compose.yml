services:
  backend:
    build: ./backend
        environment:
      AI_PROVIDER: "${AI_PROVIDER:-meta}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      META_API_BASE: "${META_API_BASE:-https://api.meta.ai/v1}"
      META_MODEL_ID: "${META_MODEL_ID:-muse-spark-1.3}"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://phyloloom.study
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
